resources:
  jobs:
    one_time_ext_setup:
      name: one-time-ext-setup      
      tasks:
        - task_key: ext_location_setup
          notebook_task:
            notebook_path: ../src/notebooks/setup/00-setup.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: env
          default: dev
        - name: catalog
          default: ${var.catalog_in_use}
      performance_target: PERFORMANCE_OPTIMIZED
